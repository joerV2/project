
name: Mark closed issues as completed

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  add-completed-label:
    runs-on: ubuntu-latest

    steps:
      - name: Add completed label
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const labelName = "completed";

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: "0e8a16",
                description: "Выполненная и закрытая задача"
              });
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: [labelName]
            });
